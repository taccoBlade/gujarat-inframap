# Netlify Production Configuration for Gujarat InfraMap
# Zero-backend static spatial digital twin deployment

[build]
  publish = "."

# Global Security & Hardening Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.fr https://*.basemaps.cartocdn.com https://*.arcgisonline.com https://server.arcgisonline.com https://services.arcgisonline.com https://*.tile.opentopomap.org https://api.mapbox.com https://*.tiles.mapbox.com https://unpkg.com https://images.unsplash.com https://upload.wikimedia.org https://lh3.googleusercontent.com; connect-src 'self' data: blob: https://*.tile.openstreetmap.fr https://*.basemaps.cartocdn.com https://*.arcgisonline.com https://server.arcgisonline.com https://services.arcgisonline.com https://*.tile.opentopomap.org https://api.mapbox.com https://unpkg.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://apis.google.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"

# HTML Document: Fast revalidation to guarantee users receive current versions
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# GeoJSON Static Spatial Datasets: Aggressive edge caching with stale-while-revalidate
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Static Assets (Versioned CSS, JS, Brand Assets)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
