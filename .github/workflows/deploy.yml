name: Deploy Gujarat InfraMap to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Enforce least-privilege security permissions for OIDC GitHub Pages token
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployment race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Quality Gate: Validates GeoJSON data integrity and JS syntax prior to deployment
  quality_gate:
    name: Production Quality & Schema Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate GeoJSON Syntax and FeatureCollection Schemas
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('data/*.geojson')
          print(f'Checking {len(files)} GeoJSON layers...')
          total_features = 0
          for f in sorted(files):
              with open(f, 'r', encoding='utf-8') as fp:
                  data = json.load(fp)
                  assert data.get('type') == 'FeatureCollection', f'{f} missing type FeatureCollection'
                  feats = len(data.get('features', []))
                  total_features += feats
                  print(f'  ✓ {f}: valid FeatureCollection ({feats} features)')
          print(f'All GeoJSON layers validated. Total features: {total_features}')
          "

      - name: Validate JavaScript Syntax
        run: |
          node --check js/app.js
          echo "✓ js/app.js passed Node syntax check"

      - name: Run Automated Deployment Integrity Test Suite
        run: |
          python scripts/verify_deployment.py

  # Deployment Job: Publishes static site to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages CDN
    needs: quality_gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
